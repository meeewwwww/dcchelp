{% for article in articles %}
<div class="article-item" data-article-id="{{ article.id }}">
    <div class="article-title">
      <div class="article-content">
        <div class="article-main">{{ article.title }}</div>
        <div class="article-meta">
          <span>Создано: {{ article.created|date:"d.m.Y H:i" }}</span> |
          <span>Обновлено: {{ article.updated|date:"d.m.Y H:i" }}</span>
        </div>
      </div>
    </div>
    <div class="article-text">{{ article.text|safe }}</div>
</div>
{% empty %}
<div class="no-articles">
    <p>Статьи для этого подтипа пока не добавлены</p>
</div>
{% endfor %}

<style>
.article-title {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    background: #f8f9fa; /* Светло-серый */
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 1.2em;
    font-weight: bold;
    color: #422253;

}

.article-meta {
    align-items: right;
    font-size: 0.6em;
    color: #333;
    font-weight: lighter;
}

.article-text {
    align-items: center;
    padding: 0px 20px;
    border-radius: 8px;
    margin-bottom: 5px;
    font-size: 1em;
    color: #333;
}
</style>
