{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="page-404" style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
">
    <!-- Декоративный элемент -->
    <div class="decoration" style="
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #904AB5 0%, #422253 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        box-shadow: 0 8px 25px rgba(66, 34, 83, 0.3);
    ">
        <span style="
            font-size: 48px;
            color: white;
            font-weight: bold;
        ">404</span>
    </div>

    <!-- Заголовок -->
    <h1 style="
        font-size: 2.5rem;
        color: #422253;
        margin-bottom: 20px;
        font-weight: 700;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    ">
        Пу-пу-пуу..
    </h1>

    <!-- Подзаголовок -->
    <p style="
        font-size: 1.3rem;
        color: #5C2F74;
        margin-bottom: 40px;
        max-width: 500px;
        line-height: 1.6;
    ">
        Ничего не найдено
    </p>

    <!-- Кнопка возврата -->
    <div class="actions" style="margin-top: 40px;">
        <a style="
            display: inline-flex;
            align-items: center;
            padding: 12px 30px;
            background: linear-gradient(135deg, #6C3483 0%, #422253 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 52, 131, 0.4);
        ">
            Погрустить
        </a>
    </div>

    <!-- Дополнительные ссылки -->
    <div class="additional-links" style="margin-top: 30px;">
        <p style="color: #6c757d; margin-bottom: 15px;">Или перейдите:</p>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
            <a href="/" style="
                padding: 8px 20px;
                background: white;
                color: #422253;
                text-decoration: none;
                border-radius: 6px;
                border: 2px solid #E8DAEF;
                transition: all 0.3s ease;
                font-weight: 500;
            ">На главную</a>
            
            <a href="javascript:history.back()" style="
                padding: 8px 20px;
                background: white;
                color: #422253;
                text-decoration: none;
                border-radius: 6px;
                border: 2px solid #E8DAEF;
                transition: all 0.3s ease;
                font-weight: 500;
            ">Назад</a>
        </div>
    </div>
</div>

<style>
    /* Анимации */
    .page-404 {
        animation: fadeIn 0.8s ease-in;
    }

    .decoration {
        animation: bounce 2s infinite;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    /* Ховер-эффекты */
    a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(108, 52, 131, 0.6) !important;
    }


    /* Адаптивность */
    @media (max-width: 768px) {
        .page-404 h1 {
            font-size: 2rem;
        }
        
        .page-404 p {
            font-size: 1.1rem;
        }
        
        .decoration {
            width: 100px;
            height: 100px;
        }
        
        .decoration span {
            font-size: 36px;
        }
    }
</style>
{% endblock %}
