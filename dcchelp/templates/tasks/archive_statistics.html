{% extends 'base.html' %}
{% block content %}
{% load static %}

<link rel="stylesheet" href="{% static 'css/archive_statistics.css' %}">

<!-- ПОДКЛЮЧАЕМ CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="archive-statistics-container">
    <!-- Раздел 1: Отобразить статистику за период -->
    <div class="archive-statistics-section">
        <h2 class="archive-statistics-section-title">Отобразить статистику за период</h2>
        <form id="statistics-form" class="archive-statistics-filter-form">
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Начальная дата</label>
                <input type="date" class="archive-statistics-form-control" id="start-date" name="start_date">
            </div>
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Конечная дата</label>
                <input type="date" class="archive-statistics-form-control" id="end-date" name="end_date">
            </div>
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Пользователь</label>
                <select name="user" class="archive-statistics-form-control" id="user-select">
                    <option value="">Не выбрано</option>
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.get_full_name|default:user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="archive-statistics-btn archive-statistics-btn-primary">Отобразить</button>
        </form>

        <!-- Контейнер для графика - изначально скрыт -->
        <div id="chart-container" class="archive-statistics-chart-container" style="display: none;">
            <canvas id="statistics-chart"></canvas>
        </div>

        <!-- Сообщение о необходимости выбрать фильтры -->
        <div id="chart-placeholder" class="archive-statistics-no-results">
            <p>Выберите параметры фильтрации и нажмите "Отобразить" для просмотра статистики</p>
        </div>
    </div>

    <!-- Остальные разделы без изменений -->
    <div class="archive-statistics-section">
        <h2 class="archive-statistics-section-title">Экспортировать данные в Excel</h2>
        <form id="export-form" class="archive-statistics-filter-form">
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Начальная дата</label>
                <input type="date" class="archive-statistics-form-control" name="start_date">
            </div>
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Конечная дата</label>
                <input type="date" class="archive-statistics-form-control" name="end_date">
            </div>
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">&nbsp;</label>
                <button type="submit" class="archive-statistics-btn archive-statistics-btn-success">Экспортировать в формате .xlsx</button>
            </div>
        </form>
    </div>

    <div class="archive-statistics-section">
        <h2 class="archive-statistics-section-title">Изменить архивные данные</h2>
        <form id="search-form" class="archive-statistics-filter-form">
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Номер задачи</label>
                <input type="text" class="archive-statistics-form-control" name="number" placeholder="Введите номер задачи">
            </div>
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Название задачи</label>
                <input type="text" class="archive-statistics-form-control" name="name" placeholder="Введите название задачи">
            </div>
            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">&nbsp;</label>
                <button type="submit" class="archive-statistics-btn archive-statistics-btn-primary">Найти</button>
            </div>
        </form>

        <div id="search-results" class="archive-statistics-search-results">
            <!-- Результаты поиска будут отображаться здесь -->
        </div>
    </div>
</div>


<!-- Модальное окно для редактирования задачи -->
<div id="edit-modal" class="archive-statistics-edit-modal archive-statistics-hidden">
    <div class="archive-statistics-modal-content">
        <div class="archive-statistics-modal-header">
            <h3 class="archive-statistics-modal-title">Редактирование задачи</h3>
            <button class="archive-statistics-close-btn" onclick="closeEditModal()">&times;</button>
        </div>
        <div id="edit-message"></div>
        <form id="edit-form" class="archive-statistics-edit-form">
            <input type="hidden" id="edit-task-id" name="task_id">

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Номер</label>
                <input type="text" class="archive-statistics-form-control" id="edit-number" name="number" required>
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Дата создания</label>
                <input type="text" class="archive-statistics-form-control" id="edit-created" name="created" placeholder="ДД.ММ.ГГГГ ЧЧ:ММ" required>
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Название</label>
                <input type="text" class="archive-statistics-form-control" id="edit-name" name="name" required>
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Тип</label>
                <input type="text" class="archive-statistics-form-control" id="edit-type" name="type">
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Приоритет</label>
                <select class="archive-statistics-form-control" id="edit-priority" name="priority">
                    <option value="false">Нет</option>
                    <option value="true">Да</option>
                </select>
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Итерация</label>
                <input type="number" class="archive-statistics-form-control" id="edit-iteration" name="iteration" value="1">
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Статус</label>
                <input type="text" class="archive-statistics-form-control" id="edit-status" name="status">
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Дата завершения</label>
                <input type="date" class="archive-statistics-form-control" id="edit-finished" name="finished">
            </div>

            <div class="archive-statistics-form-group">
                <label class="archive-statistics-form-label">Пользователь</label>
                <select class="archive-statistics-form-control" id="edit-user" name="user">
                    <option value="">Не выбрано</option>
                    {% for user in users %}
                        <option value="{{ user.id }}">{{ user.get_full_name|default:user.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="archive-statistics-form-group archive-statistics-full-width">
                <label class="archive-statistics-form-label">Результат</label>
                <textarea class="archive-statistics-form-control" id="edit-result" name="result" rows="3"></textarea>
            </div>

            <div class="archive-statistics-form-group archive-statistics-full-width">
                <label class="archive-statistics-form-label">Комментарий</label>
                <textarea class="archive-statistics-form-control" id="edit-comment" name="comment" rows="3"></textarea>
            </div>

            <div class="archive-statistics-form-actions">
                <button type="button" class="archive-statistics-btn archive-statistics-btn-cancel" onclick="closeEditModal()">Отмена</button>
                <button type="submit" class="archive-statistics-btn archive-statistics-btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Проверка загрузки Chart.js
    function checkChartJS() {
        if (typeof Chart === 'undefined') {
            console.error('Chart.js не загружен!');
            return false;
        }
        return true;
    }

    // Основная функция для создания графика
    function createChart(chartData, chartType = 'bar', dataType = 'users') {
        if (!checkChartJS()) {
            alert('Библиотека графиков не загружена. Пожалуйста, обновите страницу.');
            return;
        }

        const ctx = document.getElementById('statistics-chart').getContext('2d');

        // Уничтожаем предыдущий график если существует
        if (window.statisticsChart) {
            window.statisticsChart.destroy();
        }

        const labels = chartData.labels;
        const counts = chartData.data;

        // Проверяем есть ли данные
        if (labels.length === 0 || counts.length === 0) {
            document.getElementById('chart-container').style.display = 'none';
            document.getElementById('chart-placeholder').innerHTML =
                '<p>' + (chartData.message || 'Нет данных для отображения') + '</p>';
            document.getElementById('chart-placeholder').style.display = 'block';
            return;
        }

        // Определяем заголовок в зависимости от типа данных
        let chartLabel = '';
        let xAxisTitle = '';

        if (dataType === 'user') {
            chartLabel = 'Количество выполненных задач';
            xAxisTitle = 'Дата';
        } else {
            chartLabel = 'Количество задач по пользователям';
            xAxisTitle = 'Пользователь';
        }

        window.statisticsChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: chartLabel,
                    data: counts,
                    backgroundColor: '#6C3483',
                    borderColor: '#5A2D72',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Количество задач'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: xAxisTitle
                        }
                    }
                }
            }
        });

        // Показываем контейнер с графиком
        document.getElementById('chart-container').style.display = 'block';
        document.getElementById('chart-placeholder').style.display = 'none';
    }

    // Обработчик формы статистики
    document.getElementById('statistics-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Проверяем загружен ли Chart.js
        if (!checkChartJS()) {
            alert('Библиотека графиков не загружена. Пожалуйста, обновите страницу.');
            return;
        }

        const formData = new FormData(this);
        const params = new URLSearchParams();
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;

        // Проверка на обязательные поля
        if (!startDate || !endDate) {
            alert('Пожалуйста, выберите начальную и конечную даты');
            return;
        }

        for (let [key, value] of formData.entries()) {
            if (value) params.append(key, value);
        }

        // Показываем загрузку
        const submitButton = this.querySelector('button[type="submit"]');
        const originalText = submitButton.textContent;
        submitButton.textContent = 'Загрузка...';
        submitButton.disabled = true;

        try {
            const response = await fetch(`/tasks/archive/get-statistics/?${params}`);
            const data = await response.json();

            if (data.error) {
                alert('Ошибка: ' + data.error);
                return;
            }

            // Создаем график с учетом типа данных
            createChart(data, 'bar', data.type);

        } catch (error) {
            console.error('Error:', error);
            alert('Произошла ошибка при загрузке статистики');
        } finally {
            // Восстанавливаем кнопку
            submitButton.textContent = originalText;
            submitButton.disabled = false;
        }
    });

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        // Скрываем контейнер графика при загрузке
        document.getElementById('chart-container').style.display = 'none';
        document.getElementById('chart-placeholder').style.display = 'block';
    });
</script>

<style>
    .archive-statistics-no-results {
        padding: 20px;
        text-align: center;
        color: #666;
        font-style: italic;
        background: #f8f9fa;
        border-radius: 8px;
        margin-top: 20px;
    }

    .archive-statistics-message-info {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 12px;
        margin: 10px 0;
        border-radius: 4px;
        color: #0d47a1;
    }

    /* Адаптивность графика */
    @media (max-width: 768px) {
        .archive-statistics-chart-container {
            height: 300px !important;
        }
    }
</style>

{% endblock %}
