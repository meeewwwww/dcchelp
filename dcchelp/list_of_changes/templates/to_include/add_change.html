<div id="changeModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Добавить изменение</h2>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form method="POST" action="/list_of_changes/add/" id="changeForm">
                {% csrf_token %}
                <div class="form-group">
                    <label for="number">Номер изменения:</label>
                    <input type="text" id="number" name="number" required>
                </div>

                <div class="form-group">
                    <label for="title">Название:</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="text">Описание:</label>
                    <div class="text-editor-toolbar">
                        <button type="button" onclick="formatText('bold')" title="Жирный"><b>B</b></button>
                        <button type="button" onclick="formatText('italic')" title="Курсив"><i>I</i></button>
                        <button type="button" onclick="formatText('underline')" title="Подчеркивание"><u>U</u></button>
                    </div>
                    <div class="text-editor-wrapper">
                        <div id="text_editor" class="text-editor" contenteditable="true"></div>
                    </div>
                    <!-- Скрытое поле для отправки HTML -->
                    <textarea id="text" name="text" style="display:none"></textarea>
                </div>

                <div class="form-group">
                    <label for="link_approvement">Ссылка на согласование:</label>
                    <input type="text" id="link_approvement" name="link_approvement">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn-submit">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
